packages:
  - "compiler-wasm"
  - "mcp"
  - "runtime"
  - "language"
  - "language/prettier-plugin-slurp"
  - "vscode-extension"
  - "tests/integration"

# An install script is arbitrary code running at install time, which is the main way a
# compromised npm package reaches a developer machine. pnpm 10 stopped running them by default
# and asks instead, so this list is a deliberate grant, not configuration to silence a warning.
# Add an entry only after deciding that the package genuinely needs to build, and say why.
allowBuilds:
  # Required. tsup and vite both drive esbuild, and its install script is what puts the
  # platform-specific binary in place. Nothing builds without it.
  esbuild: true
  # Both are @vscode/vsce dependencies, reached only by `pnpm package` in vscode-extension:
  # vsce-sign fetches a native binary for signing a VSIX, keytar builds a native module for
  # storing publish credentials. No gate runs vsce, publishing uses a PAT from the environment
  # rather than a keychain, and the extension is not on the Marketplace yet. Flip whichever one
  # `vsce package` actually turns out to need, rather than both pre-emptively.
  '@vscode/vsce-sign': false
  keytar: false

# Security pin. `monaco-editor` (a dev dependency of @bytesell/slurp-language) pulls a
# transitive `dompurify`; versions below 3.4.12 carry a prototype-pollution
# advisory. This lives HERE and not in package.json because pnpm 10 stopped
# reading the `pnpm` field from package.json and ignores it with only a warning,
# which would drop the pin silently on any non-frozen install.
overrides:
  dompurify: "^3.4.12"
