version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch bumps are noise individually and useful in a batch. Several of the
      # advisories this repo has carried were cleared by a patch bump alone.
      rust-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # A major bump here needs a source change and a look at the MSRV, so it
      # should be a deliberate pull request rather than an automated one.
      - dependency-name: "axum"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ammonia"
        update-types: ["version-update:semver-major"]
      - dependency-name: "image"
        update-types: ["version-update:semver-major"]
      # reqwest 0.13 renamed the `rustls-tls` feature to `rustls` AND repointed it at
      # `rustls-platform-verifier`, so it trusts the host's system roots instead of the bundled
      # webpki set. Both manifests document the bundled-roots behaviour on purpose, and
      # slurp-image is an SSRF-hardened fetcher, so that is a deliberate decision rather than a
      # version bump. Revisit as its own pull request.
      - dependency-name: "reqwest"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Alpine is the runtime's one browser-facing dependency and a major bump
      # changes behaviour on every page that loads it.
      - dependency-name: "alpinejs"
        update-types: ["version-update:semver-major"]
      # NOT a dependency to keep current, at any level. It is the VS Code API surface the
      # extension typechecks against, pinned exactly to the engines.vscode floor so the compiler
      # refuses an API our declared minimum does not have. Every bump here silently widens what
      # the extension may call while the Marketplace still installs it on the old floor, so
      # raising it is a decision made together with engines.vscode, never an automated PR.
      - dependency-name: "@types/vscode"
      # tailwind-merge decides which Tailwind major `cn()` resolves conflicts for, and `cn` is
      # exported from the runtime's package root and published on `window`. A major here is a
      # published behaviour change that no test in this repo can catch.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
