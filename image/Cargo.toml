[package]
name = "slurp-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "On-demand image resizing and transcoding service for Slurp themes, with SSRF and decompression-bomb protection."

[lib]
name = "slurp_image"
path = "src/lib.rs"

[[bin]]
name = "slurp-image"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# TODO: upgrade to axum 0.8
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "timeout"] }
# SECURITY: `default-features = false` is load-bearing, do not drop it. The image crate's default
# feature set is `["rayon", "default-formats"]`, which links bmp, dds, exr, ff, gif, hdr, ico, jpeg,
# png, pnm, qoi, tga, tiff and webp - eleven decoders this service never declared, reachable through
# `with_guessed_format()` by anything that gets past the magic-byte check. Enable only the formats
# `security::SourceFormat` declares.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png", "gif"] }
ravif = { version = "0.11", default-features = false, features = ["threading"] }
rgb = "0.8"
# TLS: rustls, not the default native-tls. reqwest's default feature set pulls
# `openssl` + `openssl-sys`, which makes a fresh Linux clone fail at LINK time
# unless libssl-dev and pkg-config happen to be installed. rustls is pure Rust
# and already in this tree, so this keeps `cargo build` working out of the box.
# `charset` and `http2` are re-added because they are reqwest defaults that
# `default-features = false` would otherwise drop. Note `rustls-tls` uses the
# bundled webpki root store, so the host's system trust store is not consulted.
reqwest = { version = "0.12", default-features = false, features = ["stream", "charset", "http2", "rustls-tls"] }
bytes = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
moka = { version = "0.12", features = ["future"] }
url = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
