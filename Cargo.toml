[workspace]
resolver = "2"
members = [
    "compiler",
    "dev-server",
    "image",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
# MSRV. Two separate floors feed into this number, so do not lower it casually:
#   * edition 2024 needs 1.85, and an older toolchain fails with a confusing
#     "feature `edition2024` is required" error rather than a version message;
#   * the dependency tree needs 1.88, currently set by `image` (and `time`,
#     `cookie_store`). Verify with `cargo check` under the pinned toolchain,
#     which reports the exact package and version that raises the floor.
# Mirrored in rust-toolchain.toml. Raising this is a breaking change for
# downstream users, so change both files in the same commit.
rust-version = "1.88"
authors = ["ByteSell LLC"]
license = "MIT"
repository = "https://github.com/bytesell/slurp"
homepage = "https://github.com/bytesell/slurp"
keywords = ["template", "html", "templating", "compiler", "ssr"]
categories = ["template-engine", "web-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
